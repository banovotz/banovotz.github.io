<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description }}">
<meta property="og:title" content="{{ page.title | default: site.title | xml_escape }}"
<meta property="og:description" content="{{ page.description | default: site.description | xml_escape }}">
<meta property="og:image" content="{{ page.image | default: site.image | relative_url  }}">
<meta property="og:url" content="{{ page.url | relative_url | default: site.url }}">
<meta property="og:type" content="website">

<!-- Clean, absolute path injection using Jekyll filters -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<link rel="canonical" href="{{ page.url | absolute_url }}" />

<!-- Hotjar Tracking Code for https://davorbanovic.com/ -->
    <script>
        (function (h, o, t, j, a, r) {
            h.hj = h.hj || function () { (h.hj.q = h.hj.q || []).push(arguments) };
            h._hjSettings = { hjid: 6526095, hjsv: 6 };
            a = o.getElementsByTagName('head')[0];
            r = o.createElement('script'); r.async = 1;
            r.src = t + h._hjSettings.hjid + j + h._hjSettings.hjsv;

<!-- Automated Semantic Profile Engine -->
<script type="application/ld-json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "mainEntity": {
    "@type": "Person",
    "name": "Davor Banović",
    "jobTitle": ["Author", "Literary Translator"],
    "knowsAbout": [
      "Creative Writing",  
      "Literary Translation",
      "Theology",
      "Philosophy",
      "IT"
      {% for item in site.data.translations %}
        "Translation of {{ item.author | escape }}"{% if forloop.last == false %},{% endif %}
      {% endfor %}
    ]
  }
}
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/assets/js/sw.js');
    });
  }
</script>

<div>{% include ga.html %}</div>  

<!-- Navigation Bar -->
<header class="main-header">
  <div class="container main-nav">
    <a href="{{ '/#' | relative_url }}" class="logo">Davor Banović</a>
    <ul>
      <li id="mobile-content" style="display: none;"><a href="{{ '/#' | relative_url }}">Home</a></li>
      <li><a href="{{ '/#knjige' | relative_url }}">Knjige</a></li>
      <li><a href="{{ '/#knjizevno-prevodenje' | relative_url }}">Prevođenje</a></li>
      <li><a href="{{ '/blog' | relative_url }}">Blog</a></li>

       </ul>
  </div>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Simple regex to check for mobile user agents
    const isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
    
    if (isMobile) {
      document.getElementById('mobile-content').style.display = 'block';
    } else {
      document.getElementById('desktop-content').style.display = 'block';
    }
  });
</script>

</header>
