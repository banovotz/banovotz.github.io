<nav class="category-nav" aria-label="Kategorije članaka">
  <span class="category-nav-label"></span>
  <ul class="category-list">
    <!-- Gumb za sve članke -->
    <li class="category-item">
      <a href="{{ '/blog/' | relative_url }}#posts" 
         class="category-link {% if page.url == '/blog/' %}is-active{% endif %}">
        Sve
      </a>
    </li>
    
    <!-- Dinamičke kategorije iz _data/categories.yml -->
    
    {% for cat in site.data.categories %}
      {% assign cat_url = '/' | append: cat.slug | append: '/' %}
      {% assign is_active = false %}
    
    {% if page.url contains cat.slug %}
      {% assign is_active = true %}
      
    {% endif %}
      <li class="category-item">
        <a href="{{ cat_url | relative_url }}#posts" 
           class="category-link {% if is_active %}is-active{% endif %}">
          {{ cat.name }}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
