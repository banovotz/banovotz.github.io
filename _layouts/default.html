<!DOCTYPE html>
<html lang="hr-HR">
<head>
  {% include head.html %}
</head>
<body>

  <main>
    {{ content }}
  </main>

 <!-- Floating Contact Action Button matching the custom `--accent-color` rule paths -->
<a href="{{ '/#contact' | relative_url }}" 
   class="floating-contact-btn dynamic-mail" 
   aria-label="Kontaktirajte me putem e-pošte">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
    </svg>
</a>

  
 <script src="{{ '/assets/js/script.js' | relative_url }}"></script>
</body>
<!-- Footer -->
    <footer class="main-footer">
        <div class="container">
            <div class="footer-socials">
                <a href="https://www.linkedin.com/in/davorbanovic/" target="_blank" aria-label="LinkedIn">
                    <!-- Inline SVG for LinkedIn Icon -->
                    <i class="fa fa-linkedin" style="font-size:26px" fill="currentColor"></a></i> 
                <a href="https://www.instagram.com/banovotz" target="_blank" aria-label="Instagram">
                    <!-- Inline SVG for Instagram Icon -->
                    <i class="fa fa-instagram" style="font-size:26px" fill="currentColor"></a></i>
            </div>
            <div class="footer-credits">
                <p><b>BRIDGING WORLDS ACROSS THE REPUBLIC OF LETTERS</b></p>

        </div>
